name: Verified official event feed

on:
  schedule:
    # 매일 07:15 KST: 향후 공식 실적 발표일 발견.
    - cron: "15 22 * * *"
    # 평일 주요 글로벌 발표 창에만 매시간 확인한다(기존 30분×24/7 대비 82% 축소).
    - cron: "17 20-23,5-9,12-14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-sayo-study-publish
  cancel-in-progress: false

jobs:
  update-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    defaults:
      run:
        working-directory: study
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Discover official earnings dates
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 22 * * *' }}
        run: python scripts/discover_earnings_calendar.py

      - name: Check whether an announcement window is active
        id: due
        run: python scripts/check_due_events.py

      - name: Detect official earnings result publication
        if: ${{ steps.due.outputs.active == 'true' || ((github.event_name == 'workflow_dispatch' || github.event.schedule == '15 22 * * *') && steps.due.outputs.backfill_active == 'true') }}
        env:
          INCLUDE_RECENT_OVERDUE: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 22 * * *' }}
        run: python scripts/collect_earnings_results.py

      - name: Collect supported official macro results
        if: ${{ steps.due.outputs.active == 'true' }}
        run: python scripts/collect_event_results.py

      - name: Build verified event feed
        id: build
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 22 * * *' || steps.due.outputs.active == 'true' }}
        run: python scripts/build_event_feed.py

      - name: Run event tests and static validation
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 22 * * *' || steps.due.outputs.active == 'true' }}
        run: |
          python -m unittest discover -s tests -p "test_*event*.py" -v
          python scripts/validate_build.py

      - name: Save verified event snapshot
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 22 * * *' || steps.due.outputs.active == 'true' }}
        run: |
          git config user.name "stock-sayo-study-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/event-calendar.json data/event-results.json public/data/event-latest.json
          git diff --cached --quiet || git commit -m "chore: refresh verified event feed"
          git push

      - name: Install Firebase CLI
        if: ${{ env.FIREBASE_TOKEN != '' && steps.build.outputs.changed == 'true' }}
        run: npm install --global firebase-tools

      - name: Deploy validated event feed
        if: ${{ env.FIREBASE_TOKEN != '' && steps.build.outputs.changed == 'true' }}
        run: firebase deploy --only hosting --non-interactive --token "$FIREBASE_TOKEN"
