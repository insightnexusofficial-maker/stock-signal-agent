name: Verified official event feed

on:
  schedule:
    # 매일 07:15 KST: 향후 공식 실적 발표일 발견.
    - cron: "15 22 * * *"
    # 평일 주요 글로벌 발표 창에만 매시간 확인한다(기존 30분×24/7 대비 82% 축소).
    - cron: "17 20-23,5-9,12-14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-sayo-study-publish
  cancel-in-progress: false

jobs:
  update-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
    defaults:
      run:
        working-directory: study
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Discover official earnings dates
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 22 * * *' }}
        run: python scripts/discover_earnings_calendar.py

      - name: Check whether an announcement window is active
        id: due
        run: python scripts/check_due_events.py

      - name: Detect official earnings result publication
        id: earnings
        if: ${{ steps.due.outputs.active == 'true' || ((github.event_name == 'workflow_dispatch' || github.event.schedule == '15 22 * * *') && steps.due.outputs.backfill_active == 'true') }}
        env:
          INCLUDE_RECENT_OVERDUE: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 22 * * *' }}
        run: python scripts/collect_earnings_results.py

      - name: Collect supported official macro results
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 22 * * *' || steps.due.outputs.active == 'true' }}
        run: python scripts/collect_event_results.py --include-recent-overdue

      - name: Apply verified announcement impact to the cycle
        id: impact
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 22 * * *' || steps.due.outputs.active == 'true' }}
        run: python scripts/apply_event_cycle_impact.py

      - name: Refresh company assessments only after an earnings result
        id: quant
        if: ${{ steps.earnings.outputs.changed == 'true' }}
        run: python scripts/sync_sayo_quant.py

      - name: Build verified event feed
        id: build
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 22 * * *' || steps.due.outputs.active == 'true' }}
        run: python scripts/build_event_feed.py

      - name: Run event tests and static validation
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 22 * * *' || steps.due.outputs.active == 'true' }}
        run: |
          python -m unittest discover -s tests -p "test_*event*.py" -v
          python -m unittest tests/test_apply_event_cycle_impact.py tests/test_sync_sayo_quant_lifecycle.py -v
          python scripts/validate_build.py

      - name: Save verified event snapshot
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 22 * * *' || steps.due.outputs.active == 'true' }}
        run: |
          git config user.name "stock-sayo-study-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/event-calendar.json data/event-results.json data/evidence.json public/data/event-latest.json public/data/cycle-latest.json public/data/quant-latest.json
          git diff --cached --quiet || git commit -m "chore: refresh verified event feed"
          git push

      - name: Install Firebase CLI
        if: ${{ env.FIREBASE_TOKEN != '' && (steps.build.outputs.changed == 'true' || steps.impact.outputs.cycle_changed == 'true' || steps.quant.outputs.changed == 'true') }}
        run: npm install --global firebase-tools

      - name: Deploy validated event feed
        if: ${{ env.FIREBASE_TOKEN != '' && (steps.build.outputs.changed == 'true' || steps.impact.outputs.cycle_changed == 'true' || steps.quant.outputs.changed == 'true') }}
        run: firebase deploy --only hosting --non-interactive --token "$FIREBASE_TOKEN"

      - name: Install alert dependencies for a critical interrupt
        if: ${{ steps.impact.outputs.critical == 'true' && secrets.FIREBASE_SERVICE_ACCOUNT_KEY != '' }}
        working-directory: .
        run: pip install --disable-pip-version-check --no-input -r requirements-uploader.txt

      - name: Create temporary Firebase key for a critical interrupt
        if: ${{ steps.impact.outputs.critical == 'true' && secrets.FIREBASE_SERVICE_ACCOUNT_KEY != '' }}
        working-directory: .
        run: |
          umask 077
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > firebase-key.json

      - name: Push the audited critical cycle interrupt
        if: ${{ steps.impact.outputs.critical == 'true' && secrets.FIREBASE_SERVICE_ACCOUNT_KEY != '' }}
        working-directory: .
        run: python send_cycle_interrupt_alerts.py

      - name: Remove temporary alert credentials
        if: always()
        working-directory: .
        run: rm -f firebase-key.json
