name: Event Shock Alert

on:
  schedule:
    # 매일 07:00 KST. 시장 데이터 30분 수집과 별개인 알림 전용 실행이다.
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-shock-alert
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check --no-input -r requirements-uploader.txt

      - name: Create temporary Firebase key
        run: |
          umask 077
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}' > firebase-key.json

      - name: Send verified event shock alerts
        run: python send_event_alerts.py

      - name: Remove temporary credentials
        if: always()
        run: rm -f firebase-key.json
