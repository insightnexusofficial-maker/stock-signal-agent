name: Weekly semiconductor AI report

on:
  schedule:
    - cron: "0 22 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-sayo-study-publish
  cancel-in-progress: false

jobs:
  update-verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_DEPLOY_CREDENTIAL_AVAILABLE: ${{ secrets.FIREBASE_TOKEN != '' || secrets.FIREBASE_SERVICE_ACCOUNT_KEY != '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    defaults:
      run:
        working-directory: study
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Prepare temporary Hosting credential fallback
        if: ${{ env.FIREBASE_TOKEN == '' && env.FIREBASE_DEPLOY_CREDENTIAL_AVAILABLE == 'true' }}
        env:
          FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_DEPLOY_SERVICE_ACCOUNT" > "$RUNNER_TEMP/study-firebase-key.json"
          printf 'GOOGLE_APPLICATION_CREDENTIALS=%s/study-firebase-key.json\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Install contract validation dependency
        run: pip install --disable-pip-version-check --no-input -r requirements-test.txt

      - name: Collect official source candidates
        run: python scripts/collect_sources.py

      - name: Sync Stock SAYO quantitative snapshot
        run: python scripts/sync_sayo_quant.py

      - name: Extract and audit new evidence
        env:
          OPENAI_TERRA_MODEL: gpt-5.6-terra
          OPENAI_SOL_MODEL: gpt-5.6-sol
        run: |
          python scripts/review_candidates.py --require-reviewer
          python scripts/apply_review.py data/ai-reviewed.json

      - name: Build verified cycle report
        run: python scripts/build_cycle_report.py

      - name: Run tests and static validation
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_build.py
          python scripts/validate_schema.py

      - name: Require fresh reviewed artifacts and publication route
        run: |
          python scripts/publication_health.py
          python scripts/publication_health.py --preflight --deployment-ready "${{ env.FIREBASE_DEPLOY_CREDENTIAL_AVAILABLE == 'true' }}"

      - name: Save generated snapshots
        run: |
          git config user.name "stock-sayo-study-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/inbox.json data/evidence.json data/ai-review-log.json data/company-cycle-map.json public/data/quant-latest.json public/data/cycle-latest.json
          git diff --cached --quiet || git commit -m "chore: weekly verified report refresh"
          git push

      - name: Install Firebase CLI
        if: ${{ env.FIREBASE_DEPLOY_CREDENTIAL_AVAILABLE == 'true' }}
        run: npm install --global firebase-tools

      - name: Deploy validated report
        if: ${{ env.FIREBASE_DEPLOY_CREDENTIAL_AVAILABLE == 'true' }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only hosting --non-interactive --token "$FIREBASE_TOKEN"
          else
            firebase deploy --only hosting --non-interactive
          fi

      - name: Verify public publication identity
        run: python scripts/publication_health.py --verify-public

      - name: Record publication outcome
        if: always()
        run: |
          printf 'Study publication outcome: %s. Success requires reviewed fresh artifacts and matching public publication.\n' '${{ job.status }}' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary Hosting credential
        if: always()
        run: rm -f "$RUNNER_TEMP/study-firebase-key.json"
